<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>워드클라우드 생성기</title>

  <link rel="icon" href="/static/favicon.ico" />

  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e5e7eb;
      --text-main: #111827;
      --text-sub: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 16px;
    }

    /* 헤더 */
    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-sub);
      font-size: 14px;
    }

    /* 카드 */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }

    /* 입력 */
    label {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    /* 버튼 */
    .btn {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #eef2ff;
      color: var(--primary-dark);
    }

    .btn-secondary:hover {
      background: #e0e7ff;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 결과 */
    .result-img {
      margin-top: 16px;
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .download {
      margin-top: 14px;
      text-align: center;
    }

    .download a {
      text-decoration: none;
    }

    /* 토큰 */
    .tokens {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .token {
      background: var(--primary);
      color: white;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .error {
      color: #dc2626;
      font-weight: 600;
      margin-top: 12px;
    }

    @media (max-width: 640px) {
      .title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 헤더 -->
    <div class="header">
      <div class="title">워드클라우드 생성기</div>
      <div class="subtitle">
        검색어를 입력하면 뉴스 데이터를 기반으로 워드클라우드를 생성합니다
      </div>
    </div>

    <!-- 입력 카드 -->
    <div class="card">

      <label>검색 키워드</label>
      <input id="query" placeholder="예: 여행, 행복, 국내여행" />

      <div class="grid">
        <div>
          <label>가로(px)</label>
          <input id="width" type="number" value="1200" />
        </div>
        <div>
          <label>세로(px)</label>
          <input id="height" type="number" value="800" />
        </div>
      </div>

      <div class="grid">
        <div>
          <label>기사 개수</label>
          <input id="max_items" type="number" value="50" />
        </div>
        <div>
          <label>불용어</label>
          <input id="extra_stopwords" placeholder="기자, 사진, 오늘" />
        </div>
      </div>

      <div class="actions">
        <button id="runBtn" class="btn btn-primary">워드클라우드 생성</button>
        <button id="dlFreq" class="btn btn-secondary">빈도 CSV</button>
        <button id="dlArticles" class="btn btn-secondary">기사 CSV</button>
      </div>

    </div>

    <!-- 결과 -->
    <div class="card" id="resultCard" style="display:none;">
      <div id="result"></div>
    </div>

  </div>

  <script>
    const el = (id) => document.getElementById(id);

    const btn = el("runBtn");
    const resultDiv = el("result");
    const resultCard = el("resultCard");

    function getInputs() {
      return {
        query: el("query").value.trim(),
        width: el("width").value,
        height: el("height").value,
        max_items: el("max_items").value,
        extra_stopwords: el("extra_stopwords").value.trim(),
      };
    }

    btn.addEventListener("click", async () => {
      const { query, width, height, max_items, extra_stopwords } = getInputs();

      if (!query) {
        alert("검색어를 입력해주세요.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "생성 중...";
      resultDiv.innerHTML = "";
      resultCard.style.display = "block";

      try {
        const params = new URLSearchParams({
          query, width, height, max_items
        });

        if (extra_stopwords) {
          params.set("extra_stopwords", extra_stopwords);
        }

        const res = await fetch("/api/wordcloud?" + params.toString());
        const data = await res.json();

        if (!data.ok) {
          resultDiv.innerHTML = `<div class="error">${data.error}</div>`;
        } else {
          let tokens = "";

          (data.top_freq || []).slice(0, 20).forEach(t => {
            tokens += `<div class="token">${t.token} (${t.count})</div>`;
          });

          resultDiv.innerHTML = `
            <div>토큰 수: ${data.count_tokens}</div>

            <img src="${data.image_data}" class="result-img"/>

            <div class="download">
              <a href="${data.image_data}" download>
                <button class="btn btn-secondary">이미지 다운로드</button>
              </a>
            </div>

            <div class="tokens">${tokens}</div>
          `;
        }

      } catch (e) {
        resultDiv.innerHTML = `<div class="error">요청 실패</div>`;
      }

      btn.disabled = false;
      btn.textContent = "워드클라우드 생성";
    });

    el("dlFreq").onclick = () => {
      const { query, max_items, extra_stopwords } = getInputs();
      if (!query) return alert("검색어 입력");

      const params = new URLSearchParams({ query, max_items });

      if (extra_stopwords) {
        params.set("extra_stopwords", extra_stopwords);
      }

      location.href = "/api/export/frequencies.csv?" + params;
    };

    el("dlArticles").onclick = () => {
      const { query, max_items } = getInputs();
      if (!query) return alert("검색어 입력");

      const params = new URLSearchParams({ query, max_items });
      location.href = "/api/export/articles.csv?" + params;
    };
  </script>
</body>
</html>
